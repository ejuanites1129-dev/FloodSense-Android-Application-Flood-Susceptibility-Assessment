{% if source.portal_transitions %}<section class="panel"><h2>Available workflow actions—stay on this page</h2>{% for transition in source.portal_transitions %}<details class="workflow-inline"><summary>{{ transition.label }}</summary><p>{{ transition.confirmation }}</p><form method="post" action="{% url 'admin_portal:data-source-transition' source.pk transition.action %}">{% csrf_token %}<input type="hidden" name="expected_status" value="{{ source.status }}"><input type="hidden" name="expected_public" value="{{ source.is_publicly_releasable|yesno:'true,false' }}"><input name="expected_updated_at" type="hidden" value="{{ source.updated_at|date:'c' }}"><label><input type="checkbox" name="confirm" required> I understand that this changes source review or release status.</label><button class="button button--primary" type="submit">{{ transition.label }}</button></form></details>{% endfor %}</section>{% endif %}
