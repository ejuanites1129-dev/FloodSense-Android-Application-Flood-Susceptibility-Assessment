{% for action, label in actions %}<details class="workflow-inline"><summary>{{ label }}</summary><p>Review the full version, source eligibility and validation above. Publishing exposes only validated resident content; retiring removes it from new requests. Historical versions are preserved.</p><form method="post" action="{% url 'admin_portal:dss-flow-transition' flow.pk action %}">{% csrf_token %}<input type="hidden" name="expected_updated_at" value="{{ flow.updated_at|date:'c' }}"><label><input type="checkbox" name="confirm" required> I confirm this workflow action for {{ flow.version }}.</label><button class="button button--primary" type="submit">{{ label }}</button></form></details>{% endfor %}
